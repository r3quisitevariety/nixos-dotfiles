# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
# gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
# nixpkgs = "nixpkgs"
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.nixpkgs]
url = "https://channels.nixos.org/nixos-unstable/nixexprs.tar.zst"

[inputs.home-manager]
url = "github:nix-community/home-manager"

[inputs.home-manager.follows]
nixpkgs = "nixpkgs"

[inputs.zen-browser]
url = "github:0xc000022070/zen-browser-flake"

[inputs.zen-browser.follows]
nixpkgs = "nixpkgs"
home-manager = "home-manager"

[inputs.ncr]
url = "github:greyxp1/ncr"

[inputs.nixcu]
url = "github:TotalyEnglizLitrate/nixcu"

[inputs.nixcord]
url = "github:4evy/nixcord"

[inputs.nixcord.follows]
nixpkgs = "nixpkgs"

[inputs.nix-secrets]
url = "github:unnamed-systems/nix-secrets"

[inputs.copyparty]
url = "github:9001/copyparty"

[inputs.copyparty.follows]
nixpkgs = "nixpkgs"

[inputs.hermes-agent]
url = "github:NousResearch/hermes-agent"
frozen = true

[inputs.hermes-agent.follows]
nixpkgs = "nixpkgs"

[inputs.bunnypkgs]
url = "github:bunny-systems/pkgs"

[inputs.musnix]
url = "github:musnix/musnix"

[inputs.musnix.follows]
nixpkgs = "nixpkgs"

[inputs.sonora]
url = "github:sonorahq/sonora"

[inputs.sonora.follows]
nixpkgs = "nixpkgs"

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"

[inputs.nix-index-database.follows]
nixpkgs = "nixpkgs"

[inputs.tack]
url = "github:manic-systems/tack"
frozen = true

[inputs.tack.follows]
nixpkgs = "nixpkgs"
